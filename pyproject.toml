[build-system]
requires = [ "scikit-build-core>=0.11", "pybind11>=3.0" ]
build-backend = "scikit_build_core.build"

[project]

name = "stlrom"
version = "0.3.0"
authors = [
    {name = "Alexandre Donzé", email = "alexandre.donze@univ-grenoble-alpes.fr"},
]
description = "A library for robust online monitoring of STL specifications."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["cpp", "cmake", "extension", ""]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "ipywidgets",
    "pytest",
    "pytest-xdist"
]

[tool.pytest.ini_options]
# `pytest` from the repository root runs only the new suite (test/suite/).
# -n auto: one worker process per CPU; a test that crashes the process (segfault)
# is reported as failed and the run goes on.
testpaths = ["test/suite"]
addopts = "-n auto -p no:cacheprovider"

[tool.scikit-build]
minimum-version = "build-system.requires"
[tool.scikit-build.cmake.define]
BUILD_PYTHON_EXTENSION = "ON"
DEBUG = { env = "STLROM_DEBUG", default = "OFF" }

[tool.cibuildwheel]
build-frontend = "build[uv]"
enable = ["pypy"]